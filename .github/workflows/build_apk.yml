name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./hakpay
        
      - name: Build APK
        run: flutter build apk --release
        working-directory: ./hakpay
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: hakpay/build/app/outputs/flutter-apk/app-release.apk
          
